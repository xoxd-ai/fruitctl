name: Claude-KVM-Daemon
options:
  bundleIdPrefix: com.remrearas.claude-kvm-daemon
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

packages:
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    revision: "c8ed701b513cf5177118a175d85fbbbcd707ab41"

targets:
  claude-kvm-daemon:
    type: tool
    platform: macOS
    sources:
      - ClaudeKVM-Daemon
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser
    preBuildScripts:
      - name: Verify locked native inputs before-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" before-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    postBuildScripts:
      - name: Verify locked native inputs after-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" after-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        # Required carrier input; no Homebrew or host-path fallback.
        FRUITCTL_NATIVE_INPUT_MANIFEST: ""
        FRUITCTL_NATIVE_INPUT_DIR: ""
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        OTHER_SWIFT_FLAGS: "-parse-as-library"
        SWIFT_INCLUDE_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)"
        LIBRARY_SEARCH_PATHS:
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib"
        HEADER_SEARCH_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)/include"
        OTHER_LDFLAGS:
          - "-Wl,-search_paths_first"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"'
          - "-lz"
          - "-lpthread"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"'
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"'
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O


  VNCReconnectTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClaudeKVM-Daemon/VNC
      - Tests/VNCReconnectTests.swift
    preBuildScripts:
      - name: Verify locked native inputs before-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" before-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    postBuildScripts:
      - name: Verify locked native inputs after-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" after-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        # Required carrier input; no Homebrew or host-path fallback.
        FRUITCTL_NATIVE_INPUT_MANIFEST: ""
        FRUITCTL_NATIVE_INPUT_DIR: ""
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_INCLUDE_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)"
        LIBRARY_SEARCH_PATHS:
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib"
        HEADER_SEARCH_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)/include"
        OTHER_LDFLAGS:
          - "-Wl,-search_paths_first"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"'
          - "-lz"
          - "-lpthread"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"'
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"'


  NativeBehaviorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClaudeKVM-Daemon/VNC
      - ClaudeKVM-Daemon/Input
      - ClaudeKVM-Daemon/Protocol
      - ClaudeKVM-Daemon/DisplayScaling.swift
      - ClaudeKVM-Daemon/FramebufferBaseline.swift
      - ClaudeKVM-Daemon/FrameImageEncoder.swift
      - Tests/NativeBehaviorTests.swift
    preBuildScripts:
      - name: Verify locked native inputs before-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" before-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    postBuildScripts:
      - name: Verify locked native inputs after-link
        script: |
          exec /usr/bin/python3 -I "$SRCROOT/scripts/verify-native-input.py" "$FRUITCTL_NATIVE_INPUT_MANIFEST" "$FRUITCTL_NATIVE_INPUT_DIR" after-link
        inputFiles:
          - "$(SRCROOT)/scripts/verify-native-input.py"
          - "$(FRUITCTL_NATIVE_INPUT_MANIFEST)"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"
        showEnvVars: false
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        # Required carrier input; no Homebrew or host-path fallback.
        FRUITCTL_NATIVE_INPUT_MANIFEST: ""
        FRUITCTL_NATIVE_INPUT_DIR: ""
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_INCLUDE_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)"
        LIBRARY_SEARCH_PATHS:
          - "$(FRUITCTL_NATIVE_INPUT_DIR)/lib"
        HEADER_SEARCH_PATHS: "$(FRUITCTL_NATIVE_INPUT_DIR)/include"
        OTHER_LDFLAGS:
          - "-Wl,-search_paths_first"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libvncclient.a"'
          - "-lz"
          - "-lpthread"
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libssl.a"'
          - '"$(FRUITCTL_NATIVE_INPUT_DIR)/lib/libcrypto.a"'


  FruitctlHost:
    type: application
    platform: macOS
    sources:
      - path: FruitctlHost
        excludes: [Info.plist]
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.xoxd.fruitctl.host
        INFOPLIST_FILE: FruitctlHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO

  FruitctlHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FruitctlHost/HostLease.swift
      - FruitctlHost/HostProtocol.swift
      - FruitctlHost/HostClock.swift
      - FruitctlHost/HostCapturePreferences.swift
      - FruitctlHost/HostCapturePermission.swift
      - FruitctlHost/HostCaptureTiming.swift
      - FruitctlHost/HostCapturedSample.swift
      - FruitctlHost/HostIdleReference.swift
      - FruitctlHost/HostIPC.swift
      - Tests/FruitctlHostTests.swift
      - Tests/HostIdleReferenceTests.swift
      - Tests/HostSocketTests.swift
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO


  CredentialInputHarness:
    type: tool
    platform: macOS
    sources:
      - ClaudeKVM-Daemon/CredentialInput.swift
      - test/CredentialInputHarness.swift
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        OTHER_SWIFT_FLAGS: "-parse-as-library"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  claude-kvm-daemon:
    build:
      targets:
        claude-kvm-daemon: all
  VNCReconnectTests:
    build:
      targets:
        VNCReconnectTests: [test]
    test:
      targets:
        - name: VNCReconnectTests
          parallelizable: false
  CredentialInputHarness:
    build:
      targets:
        CredentialInputHarness: all
  NativeBehaviorTests:
    build:
      targets:
        NativeBehaviorTests: [test]
    test:
      targets:
        - name: NativeBehaviorTests
          parallelizable: false
  FruitctlHost:
    build:
      targets:
        FruitctlHost: all
  FruitctlHostTests:
    build:
      targets:
        FruitctlHostTests: [test]
    test:
      targets:
        - name: FruitctlHostTests
          parallelizable: false
